services:
  secretsanta:
    build: .
    container_name: secretsanta
    restart: unless-stopped
    ports:
      - "8082:8082"
    volumes:
      - ./data:/data
    environment:
      - PORT=8082
      - HOST=0.0.0.0
      - SECRETSANTA_DB=/data/secretsanta.db
      - REGISTRATION_PASSPHRASE=${REGISTRATION_PASSPHRASE:-}
